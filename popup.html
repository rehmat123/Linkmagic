<!DOCTYPE html>
<html>
<head>
    <title>LinkedIn Comment Enhancer</title>
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
        }
        textarea:focus {
            outline: none;
            border-color: #0a66c2;
            box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
        }
        .save-button {
            background-color: #0a66c2;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .save-button:hover {
            background-color: #004182;
        }
        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }
        .example-link {
            font-size: 12px;
            color: #0a66c2;
            text-decoration: none;
            cursor: pointer;
            margin-top: 4px;
        }
        .example-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-group">
            <label for="userContext">Your Professional Context</label>
            <textarea 
                id="userContext" 
                placeholder="Enter your professional background, expertise, or any specific context that should be considered when generating comments..."
            ></textarea>
            <a class="example-link" id="exampleContext">Load example context</a>
        </div>
        <button class="save-button" id="saveContext">Save Context</button>
        <div class="status" id="status"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
